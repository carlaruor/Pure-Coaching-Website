<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explore personalised private support, NDIS support and child safety support with Pure Coaching in Cairns.">
    <title>Pure Coaching Cairns | Find Your Support</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body class="page-home">
    <main class="gateway" aria-labelledby="gateway-title">
      <div class="gateway__intro">
        <img class="gateway__logo" src="assets/logo/pure-coaching-logo.png" alt="Pure Coaching Cairns" width="1254" height="1254">
        <h1 id="gateway-title">How can we support you?</h1>
      </div>
      <div class="gateway__panels">
        <!-- Static media placeholders; each media layer can later host a background video. -->
        <a class="gateway__panel gateway__panel--private" href="private-support.html" aria-labelledby="private-title" aria-describedby="private-description">
          <div class="gateway__media" aria-hidden="true">
            <img src="assets/images/pathways/private-support.webp" alt="" width="1536" height="1024">
          </div>
          <div class="gateway__overlay" aria-hidden="true"></div>
          <div class="gateway__content">
            <h2 id="private-title">Private Support</h2>
            <p id="private-description">Personalised support, accessed directly.</p>
            <span class="gateway__explore">Explore <span aria-hidden="true">→</span></span>
          </div>
        </a>

        <a class="gateway__panel gateway__panel--ndis" href="ndis-support.html" aria-labelledby="ndis-title" aria-describedby="ndis-description">
          <div class="gateway__media" aria-hidden="true">
            <img src="assets/images/pathways/ndis-support.webp" alt="" width="1536" height="1024">
          </div>
          <div class="gateway__overlay" aria-hidden="true"></div>
          <div class="gateway__content">
            <h2 id="ndis-title">NDIS Support</h2>
            <p id="ndis-description">Personalised support through your NDIS plan.</p>
            <span class="gateway__explore">Explore <span aria-hidden="true">→</span></span>
          </div>
        </a>

        <a class="gateway__panel gateway__panel--child" href="child-safety.html" aria-labelledby="child-title" aria-describedby="child-description">
          <div class="gateway__media" aria-hidden="true">
            <img src="assets/images/pathways/child-safety.webp" alt="" width="1536" height="1024">
          </div>
          <div class="gateway__overlay" aria-hidden="true"></div>
          <div class="gateway__content">
            <h2 id="child-title">Child Safety</h2>
            <p id="child-description">Support for children and young people.</p>
            <span class="gateway__explore">Explore <span aria-hidden="true">→</span></span>
          </div>
        </a>
      </div>
    </main>
  </body>
</html>
